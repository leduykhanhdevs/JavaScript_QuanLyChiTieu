<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">Ví Mình — Cài đặt liên kết ngân hàng, bố cục mobile</title>
<desc id="desc">Bố cục mobile cho trang cài đặt kết nối ngân hàng chưa liên kết, giải thích quyền chỉ đọc, quy trình và nút bắt đầu.</desc>
<defs><linearGradient id="brandM" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs><style>text{font-family:'Be Vietnam Pro',Arial,sans-serif;fill:#1E293B}.muted{fill:#64748B}.light{fill:#94A3B8}.blue{fill:#2563EB}.tiny{font-size:9px}.small{font-size:11px}.body{font-size:10px}.heading{font-size:19px;font-weight:700}.title{font-size:13px;font-weight:700}</style>
<rect width="390" height="844" fill="#F8FAFC"/><rect x="0" y="0" width="390" height="62" fill="#FFFFFF"/><path d="M0 62h390" stroke="#E2E8F0"/>
<rect x="18" y="11" width="39" height="39" rx="13" fill="url(#brandM)"/><path d="m29 21 7 19 7-19" stroke="#fff" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="49" cy="22" r="4.4" fill="#BFDBFE"/><circle cx="49" cy="22" r="1.7" fill="#1D4ED8"/><text x="66" y="29" font-size="14" font-weight="700">Ví Mình</text><text x="66" y="43" font-size="7" class="muted" font-weight="700" letter-spacing=".4">TÀI CHÍNH CÁ NHÂN</text><circle cx="354" cy="31" r="16" fill="#EFF6FF"/><text x="354" y="35" text-anchor="middle" class="tiny blue" font-weight="700">KL</text>
<path d="m22 91 6-6-6-6" transform="rotate(180 25 88)" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="91" class="small muted">Cài đặt</text><text x="20" y="124" class="heading">Liên kết ngân hàng</text><text x="20" y="145" class="small muted">Quản lý quyền truy cập và đồng bộ</text>
<rect x="18" y="163" width="354" height="37" rx="9" fill="#EFF6FF"/><circle cx="35" cy="181" r="7" fill="#DBEAFE"/><path d="M32 181h6m-3-3v6" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/><text x="49" y="184" font-size="8" fill="#1D4ED8" font-weight="700">BẢN THIẾT KẾ · CHƯA CÓ KẾT NỐI THẬT</text>
<rect x="18" y="214" width="354" height="238" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="48" cy="247" r="19" fill="#EFF6FF"/><path d="m39 245 9-7 9 7m-14 1v11m5-11v11m5-11v11m-14 2h18" fill="none" stroke="#2563EB" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="243" class="title">Kết nối tài khoản ngân hàng</text><text x="78" y="261" class="tiny muted">Đưa giao dịch vào Ví Mình an toàn</text>
<text x="36" y="297" class="body">Sau khi bạn đồng ý, hệ thống sẽ chuyển tới</text><text x="36" y="313" class="body">trang kết nối để chọn ngân hàng và xác thực.</text><rect x="36" y="331" width="145" height="27" rx="13.5" fill="#EFF6FF"/><path d="m48 344 3 3 5-6" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="348" font-size="8" fill="#2563EB" font-weight="700">Chỉ đọc giao dịch</text><rect x="188" y="331" width="164" height="27" rx="13.5" fill="#F8FAFC"/><path d="M201 340v7m-3-4h6" stroke="#64748B" stroke-width="1.3" stroke-linecap="round"/><text x="212" y="348" font-size="8" class="muted" font-weight="600">Không nhận mật khẩu/OTP</text>
<text x="36" y="383" class="tiny muted">Bạn có thể thu hồi quyền trong Cài đặt bất cứ lúc nào.</text><text x="36" y="399" class="tiny muted">Giao dịch chưa rõ sẽ chờ bạn phân loại trong Giao dịch.</text><rect x="36" y="413" width="318" height="27" rx="8" fill="#2563EB"/><text x="195" y="431" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="700">Bắt đầu liên kết</text>
<rect x="18" y="466" width="354" height="189" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/><text x="36" y="494" class="title">Bạn luôn kiểm soát dữ liệu</text><circle cx="43" cy="521" r="11" fill="#EFF6FF"/><text x="43" y="525" text-anchor="middle" class="tiny blue" font-weight="700">1</text><text x="63" y="519" class="small" font-weight="600">Chấp thuận rõ ràng</text><text x="63" y="535" class="tiny muted">Xem phạm vi dữ liệu trước khi rời ứng dụng.</text><circle cx="43" cy="563" r="11" fill="#EFF6FF"/><text x="43" y="567" text-anchor="middle" class="tiny blue" font-weight="700">2</text><text x="63" y="561" class="small" font-weight="600">Đồng bộ có kiểm soát</text><text x="63" y="577" class="tiny muted">Có thể đồng bộ lại hoặc xem trạng thái lỗi.</text><circle cx="43" cy="605" r="11" fill="#EFF6FF"/><text x="43" y="609" text-anchor="middle" class="tiny blue" font-weight="700">3</text><text x="63" y="603" class="small" font-weight="600">Phân loại khoản chưa rõ</text><text x="63" y="619" class="tiny muted">Bạn xác nhận trước khi áp dụng quy tắc tự động.</text>
<rect x="18" y="672" width="354" height="53" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
<g fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m55 690 7-6 7 6m-12-1v8h10v-8m-7 8v-5h4v5"/><path d="M141 688h17l-3-3m3 3-3 3M159 696h-17l3 3m-3-3 3-3"/><rect x="229" y="684" width="18" height="14" rx="2"/><path d="M229 689h18m-14 5h4"/></g><text x="62" y="714" text-anchor="middle" font-size="7" class="muted">Tổng quan</text><text x="150" y="714" text-anchor="middle" font-size="7" class="muted">Giao dịch</text><text x="238" y="714" text-anchor="middle" font-size="7" class="muted">Tài khoản</text><circle cx="326" cy="692" r="10" fill="#EFF6FF"/><g transform="translate(318.5 684.5) scale(.63)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 13.5 1.2 1-.9 2.1-1.5-.2a7.9 7.9 0 0 1-1.3 1l-.3 1.5h-2.3l-.7-1.4a8 8 0 0 1-1.6 0l-.7 1.4H9l-.3-1.5a7.9 7.9 0 0 1-1.3-1l-1.5.2L5 14.5l1.2-1a8 8 0 0 1 0-1.6l-1.2-1 .9-2.1 1.5.2a7.9 7.9 0 0 1 1.3-1L9 6.5h2.3l.7 1.4a8 8 0 0 1 1.6 0l.7-1.4h2.3l.3 1.5a7.9 7.9 0 0 1 1.3 1l1.5-.2.9 2.1-1.2 1a8 8 0 0 1 0 1.6Z"/></g><text x="326" y="714" text-anchor="middle" font-size="7" fill="#2563EB" font-weight="700">Cài đặt</text><text x="195" y="760" text-anchor="middle" class="tiny light">Ví Mình không yêu cầu mật khẩu, PIN hoặc OTP ngân hàng.</text>
</svg>
