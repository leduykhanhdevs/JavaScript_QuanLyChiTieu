<title id="title">Ví Mình — Cài đặt liên kết ngân hàng, trạng thái minh họa đã kết nối</title>
<desc id="desc">Màn hình Settings desktop thể hiện trạng thái kết nối, lần đồng bộ, phạm vi chỉ đọc, tài khoản được che số, lịch sử đồng bộ và giao dịch cần phân loại. Toàn bộ dữ liệu là minh họa.</desc>
