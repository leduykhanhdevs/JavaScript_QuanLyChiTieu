<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ví Mình — Bản duyệt chat Agent thu gọn</title>
  <desc id="desc">Bong bóng chat nhỏ cố định ở góc dưới bên phải. Khi mở, desktop hiện panel 340 nhân 470 pixel, điện thoại hiện panel 350 nhân 430 pixel, không phủ toàn màn hình.</desc>
  <defs>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#183153" flood-opacity=".16"/></filter>
    <style>
      text { font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif; fill: #172B4D; }
      .muted { fill: #7184A3; }
      .subtle { fill: #93A3BB; }
      .blue { fill: #2563EB; }
      .white { fill: #fff; }
      .small { font-size: 11px; }
      .tiny { font-size: 9px; }
      .body { font-size: 12px; }
      .bold { font-weight: 700; }
      .heavy { font-weight: 800; }
    </style>
    <g id="bubble-icon">
      <path d="M11 12.5A7.5 7.5 0 0 1 18.5 5h5A7.5 7.5 0 0 1 31 12.5v1A7.5 7.5 0 0 1 23.5 21H20l-5 4v-5.4a7.4 7.4 0 0 1-4-6.1z" fill="#fff"/>
      <circle cx="17.5" cy="13" r="1.2" fill="#2563EB"/><circle cx="22" cy="13" r="1.2" fill="#2563EB"/><circle cx="26.5" cy="13" r="1.2" fill="#2563EB"/>
    </g>
    <g id="send-icon"><path d="m2 10 20-8-7 20-3.2-8.8L2 10z" fill="#fff"/><path d="m11.8 13.2 5.3-5.1" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="check-icon"><circle cx="11" cy="11" r="11" fill="#D1FAE5"/><path d="m6.5 11 3 3 6-7" stroke="#15803D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>

  <rect width="1600" height="1040" fill="#F3F7FD"/>
  <text x="42" y="42" font-size="24" class="heavy">Trợ lý Ví Mình · Khung chat gọn</text>
  <text x="42" y="65" font-size="12" class="muted">Chỉ hiện bong bóng khi thu gọn. Nhấn vào để mở panel nhỏ, không phủ nền và không đẩy nội dung trang. Số liệu nền chỉ minh họa.</text>

