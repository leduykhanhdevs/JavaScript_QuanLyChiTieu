<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080"><title>Ví Mình — Application states</title><rect width="100%" height="100%" fill="#F1F5F9"/><g id="Empty state — Chưa có giao dịch"><rect x="20" y="20" width="600" height="500" rx="18" fill="#fff" stroke="#E2E8F0"/><text x="48" y="57" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="11" font-weight="700" fill="#1E293B">Giao dịch</text><rect x="474" y="37" width="118" height="33" rx="9" fill="#2563EB"/><text x="533" y="58" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" font-weight="600" fill="#fff">＋ Thêm giao dịch</text><line x1="20" y1="81" x2="620" y2="81" stroke="#E2E8F0"/><circle cx="320" cy="219" r="62" fill="#EFF6FF"/><circle cx="320" cy="219" r="39" fill="#fff" stroke="#BFDBFE" stroke-width="2"/><text x="320" y="231" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="30" font-weight="700" fill="#2563EB">₫</text><text x="320" y="328" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="16" font-weight="700" fill="#1E293B">Chưa có giao dịch nào</text><text x="320" y="353" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" fill="#64748B">Thêm khoản thu hoặc chi đầu tiên để bắt đầu theo dõi</text><rect x="245" y="377" width="150" height="38" rx="10" fill="#2563EB"/><text x="320" y="401" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="10" font-weight="600" fill="#fff">＋  Tạo giao dịch</text><text x="320" y="461" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" fill="#94A3B8">Bạn có thể tìm kiếm hoặc lọc giao dịch sau khi thêm dữ liệu.</text></g>
<g id="Offline state — Cache và đồng bộ"><rect x="660" y="20" width="600" height="500" rx="18" fill="#fff" stroke="#E2E8F0"/><text x="688" y="57" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="11" font-weight="700" fill="#1E293B">Tổng quan tài chính</text><rect x="683" y="78" width="554" height="50" rx="11" fill="#FFF7E2"/><circle cx="706" cy="103" r="10" fill="#F1B94C"/><text x="706" y="107" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" font-weight="700" fill="#fff">!</text><text x="725" y="99" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="600" fill="#8B6516">Đang ngoại tuyến · Đang hiển thị dữ liệu đã lưu</text><text x="725" y="114" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="7" fill="#9A7A35">Thay đổi mới sẽ đồng bộ khi kết nối được khôi phục.</text><rect x="683" y="146" width="554" height="116" rx="14" fill="#1E3A8A"/><text x="705" y="177" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="700" fill="#BFDBFE">TỔNG SỐ DƯ · DỮ LIỆU CACHE</text><text x="705" y="220" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">32.480.000 ₫</text><rect x="683" y="280" width="554" height="113" rx="14" fill="#fff" stroke="#E2E8F0"/><text x="703" y="310" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="10" font-weight="700" fill="#1E293B">Lịch sử giao dịch</text><text x="703" y="345" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" fill="#64748B">Lần đồng bộ gần nhất</text><text x="1217" y="345" text-anchor="end" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="600" fill="#1E293B">14/10/2026 · 09:42</text><line x1="703" y1="360" x2="1217" y2="360" stroke="#E2E8F0"/><text x="703" y="380" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" fill="#64748B">Trạng thái</text><text x="1217" y="380" text-anchor="end" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="600" fill="#AD7919">Đang chờ kết nối</text><rect x="683" y="411" width="554" height="55" rx="11" fill="#FFF0EC"/><text x="703" y="435" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="600" fill="#C25845">Không lưu được thay đổi</text><text x="703" y="451" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="7" fill="#8F635B">Máy chủ chưa phản hồi. Dữ liệu chưa được ghi nhận.</text><text x="1218" y="443" text-anchor="end" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="600" fill="#C25845">Thử lại</text></g>
<g id="Form validation — Lỗi theo trường"><rect x="20" y="550" width="600" height="500" rx="18" fill="#fff" stroke="#E2E8F0"/><text x="48" y="588" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="11" font-weight="700" fill="#1E293B">Thêm giao dịch</text><text x="48" y="612" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" fill="#64748B">Khoản chi · 14/10/2026</text><text x="48" y="656" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="600" fill="#1E293B">Số tiền</text><rect x="48" y="666" width="536" height="40" rx="8" fill="#fff" stroke="#F07D68" stroke-width="1.5"/><text x="62" y="691" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" fill="#64748B">0 ₫</text><text x="48" y="724" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="7" fill="#D45F4C">Số tiền phải lớn hơn 0.</text><text x="48" y="760" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="600" fill="#1E293B">Danh mục</text><rect x="48" y="770" width="536" height="40" rx="8" fill="#fff" stroke="#F07D68" stroke-width="1.5"/><text x="62" y="795" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" fill="#94A3B8">Chọn danh mục</text><text x="48" y="828" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="7" fill="#D45F4C">Vui lòng chọn danh mục phù hợp với khoản chi.</text><text x="48" y="864" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="600" fill="#1E293B">Ghi chú</text><rect x="48" y="874" width="536" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><text x="62" y="899" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" fill="#94A3B8">Ví dụ: Cà phê sáng</text><rect x="424" y="951" width="160" height="40" rx="10" fill="#2563EB"/><text x="504" y="976" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" font-weight="600" fill="#fff">Lưu giao dịch</text></g>
<g id="Delete confirmation — Xác nhận xoá"><rect x="660" y="550" width="600" height="500" rx="18" fill="#fff" stroke="#E2E8F0"/><rect x="660" y="550" width="600" height="500" rx="18" fill="#1E3A8A" opacity=".08"/><rect x="760" y="672" width="400" height="252" rx="18" fill="#fff" stroke="#E2E8F0"/><circle cx="960" cy="721" r="26" fill="#FFF0EC"/><text x="960" y="730" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="22" font-weight="700" fill="#F07D68">!</text><text x="960" y="772" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E293B">Xoá giao dịch này?</text><text x="960" y="796" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" fill="#64748B">Hành động này sẽ xoá khoản chi 65.000 ₫</text><text x="960" y="812" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" fill="#64748B">“Cà phê Góc Phố” khỏi lịch sử của bạn.</text><rect x="789" y="839" width="142" height="38" rx="9" fill="#fff" stroke="#E2E8F0"/><text x="860" y="863" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" font-weight="600" fill="#1E293B">Huỷ</text><rect x="949" y="839" width="182" height="38" rx="9" fill="#D95F4B"/><text x="1040" y="863" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" font-weight="600" fill="#fff">Xoá giao dịch</text><rect x="692" y="584" width="216" height="30" rx="9" fill="#EFF6FF"/><text x="800" y="604" text-anchor="middle" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="8" font-weight="600" fill="#2563EB">✓  Đã lưu giao dịch thành công</text><text x="692" y="640" font-family="Be Vietnam Pro,Arial,sans-serif" font-size="9" fill="#64748B">Toast success · xác nhận xóa · modal nền mờ</text></g></svg>