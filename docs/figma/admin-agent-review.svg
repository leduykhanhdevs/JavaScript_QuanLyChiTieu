  <text x="1064" y="892" fill="#1E40AF" font-size="11" font-weight="700">Mọi thay đổi vẫn cần xác nhận trong màn quản trị.</text>

  <text x="286" y="970" class="muted tiny">BẢN XEM TRƯỚC LAYOUT · Các dấu “—” là vị trí số liệu tải từ API, không phải dữ liệu mẫu.</text>
