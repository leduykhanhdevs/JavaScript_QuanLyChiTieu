  <text x="286" y="143" class="muted" font-size="14">Phân tích hoạt động hệ thống, tạo báo cáo và đề xuất kế hoạch quản trị.</text>
  <rect x="1115" y="99" width="295" height="34" rx="17" fill="#EFF6FF"/>
