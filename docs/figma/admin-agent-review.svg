  <text x="365" y="372" class="ink" font-size="13" font-weight="800">Phân tích tăng trưởng</text>
  <text x="365" y="392" class="muted tiny">Dựa trên số tài khoản đăng ký theo tháng trong kỳ đã chọn.</text>
  <text x="328" y="429" class="ink" font-size="13">Mình sẽ so sánh số đăng ký giữa các tháng, chỉ ra xu hướng và ghi rõ khi dữ</text>
  <text x="328" y="449" class="ink" font-size="13">liệu chưa đủ để kết luận. Chưa tải số liệu trong bản xem trước này.</text>
  <rect x="328" y="474" width="201" height="81" rx="11" fill="#F5F7FA"/>
  <text x="344" y="497" class="muted tiny" font-weight="700">ĐĂNG KÝ KỲ TRƯỚC</text>
  <text x="344" y="530" class="ink" font-size="25" font-weight="800">—</text>
  <text x="328" y="541" class="muted tiny">Số liệu sẽ tải từ Admin API</text>
  <rect x="541" y="474" width="201" height="81" rx="11" fill="#F5F7FA"/>
  <text x="557" y="497" class="muted tiny" font-weight="700">ĐĂNG KÝ KỲ NÀY</text>
  <text x="557" y="530" class="ink" font-size="25" font-weight="800">—</text>
  <text x="541" y="541" class="muted tiny">Theo khoảng thời gian phía trên</text>
  <rect x="754" y="474" width="212" height="81" rx="11" fill="#EFF6FF"/>
  <text x="770" y="497" fill="#1E40AF" font-size="10" font-weight="700">THAY ĐỔI</text>
  <text x="770" y="530" fill="#1E40AF" font-size="25" font-weight="800">—</text>
  <text x="754" y="541" fill="#5575B8" font-size="10">Không suy diễn khi thiếu dữ liệu</text>
  <rect x="328" y="578" width="194" height="39" rx="9" fill="#fff" stroke="#DBEAFE"/>
  <text x="344" y="603" class="blue" font-size="11" font-weight="700">Xem biểu đồ tăng trưởng</text>
  <path d="M500 593h9m-4-4 4 4-4 4" stroke="#2563EB" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

