  <path d="m960 856 18-8-4 17-5-6-9-3Zm9 3 5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="306" y="910" class="muted tiny">Agent hiện phân tích theo quy tắc cục bộ; chưa dùng mô hình AI bên ngoài.</text>

