  <text x="1104" y="681" fill="#263349" font-size="12" font-weight="700">Nhật ký quản trị</text>
  <path d="m1367 672 4 4-4 4" stroke="#7B8799" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1042" y="741" width="368" height="185" rx="16" class="card"/>
  <circle cx="1078" cy="777" r="15" fill="#EFF6FF"/>
  <path d="M1078 768v10m0 5h.01m-7.5 6h15" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round"/>
  <text x="1104" y="775" class="ink" font-size="14" font-weight="800">Giới hạn dữ liệu</text>
  <text x="1064" y="812" class="muted small">• Không đọc nội dung giao dịch cá nhân</text>
