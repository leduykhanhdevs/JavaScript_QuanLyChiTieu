  <!-- Main conversation -->
  <rect x="286" y="166" width="738" height="760" rx="16" class="card"/>
  <rect x="286" y="166" width="738" height="71" rx="16" fill="#fff"/>
  <path d="M286 236.5h738" stroke="#EDF1F6"/>
