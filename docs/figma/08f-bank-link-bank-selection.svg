<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Ví Mình — Cài đặt liên kết ngân hàng, chọn ngân hàng</title>
<desc id="desc">Bộ chọn một ngân hàng theo danh sách SePay Bank Hub, xem phạm vi cá nhân và trạng thái CTA đang khóa cho tới khi có onboarding, sandbox và rà soát Hosted Link.</desc>
