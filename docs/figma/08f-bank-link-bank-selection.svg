<text x="556" y="391" class="small" font-weight="600">Ngân hàng</text><rect x="556" y="405" width="788" height="48" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><text x="574" y="434" class="small" font-weight="600">MBBank</text><path d="m1324 425 6 6 6-6" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="556" y="472" width="788" height="132" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="574" y="489" width="42" height="42" rx="12" fill="#EFF6FF"/><text x="595" y="515" text-anchor="middle" class="small blue" font-weight="800">MB</text><text x="632" y="506" class="card-title">MBBank</text><rect x="700" y="489" width="76" height="22" rx="11" fill="#EFF6FF"/><text x="738" y="504" text-anchor="middle" class="tiny blue" font-weight="700">Cá nhân</text><text x="632" y="529" class="tiny muted">Tài khoản chính · Bank Hub công bố đồng bộ giao dịch vào và ra.</text><rect x="632" y="548" width="88" height="25" rx="8" fill="#EFF6FF"/><text x="676" y="565" text-anchor="middle" class="tiny blue" font-weight="600">Tiền vào</text><rect x="728" y="548" width="88" height="25" rx="8" fill="#EFF6FF"/><text x="772" y="565" text-anchor="middle" class="tiny blue" font-weight="600">Tiền ra</text>
<rect x="556" y="623" width="788" height="77" rx="11" fill="#F8FAFC"/><circle cx="580" cy="648" r="9" fill="#EFF6FF"/><path d="M580 644v8m0-11v.5" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round"/><text x="599" y="648" class="small" font-weight="600">Bank Hub chưa có tham số công khai để mở sẵn ngân hàng đã chọn.</text><text x="599" y="670" class="tiny muted">Ví Mình chưa có sandbox/onboarding; nút kết nối đang khóa và không thu mật khẩu, PIN hoặc OTP.</text>
<path d="M556 720h788" stroke="#E2E8F0"/><text x="556" y="751" class="tiny muted">Hosted Link có thể cần người dùng chọn lại ngân hàng; chỉ bật sau khi provider xác nhận flow và bảo mật token.</text><rect x="1100" y="770" width="244" height="40" rx="9" fill="#E2E8F0"/><text x="1222" y="795" text-anchor="middle" font-size="10" fill="#64748B" font-weight="700">Kết nối MBBank · đang khóa</text><text x="556" y="795" class="tiny blue" font-weight="700">← Chọn ngân hàng khác</text>
<text x="530" y="866" class="tiny light">Bộ chọn hiển thị catalog Bank Hub; chưa phải trạng thái kết nối thật.</text></svg>
