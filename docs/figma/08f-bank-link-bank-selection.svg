-1.2 1a8 8 0 0 1 0 1.6Z"/></g><text x="66" y="468" class="small blue" font-weight="700">Cài đặt</text><circle cx="47" cy="916" r="17" fill="#DBEAFE"/><text x="47" y="920" text-anchor="middle" class="tiny blue" font-weight="700">KL</text><text x="72" y="914" class="small" font-weight="700">Lê Duy Khánh</text><text x="72" y="930" class="tiny light">Quản lý tài chính của riêng bạn</text>
