      <g transform="translate(92 292)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 9 10-7 10 7"/><path d="M4 8v12h16V8"/><path d="M9 20v-7h6v7"/>
      </g>
      <text x="126" y="307" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" font-weight="600" fill="#102A56">Tổng quan</text>
    </g>

    <text x="82" y="355" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#95A3B8">QUẢN LÝ TÀI CHÍNH</text>
    <g id="nav-transactions">
      <g transform="translate(92 372)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="20" rx="2.5"/><path d="M7 7h10M7 12h10M7 17h6"/></g>
      <text x="126" y="387" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" font-weight="500" fill="#172B4D">Giao dịch</text>
