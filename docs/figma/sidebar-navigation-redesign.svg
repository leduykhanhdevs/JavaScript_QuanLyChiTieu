<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <rect width="1600" height="1120" fill="#F5F8FC"/>

  <text x="64" y="54" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#2563EB">VÍ MÌNH · ĐIỀU HƯỚNG</text>
  <text x="64" y="96" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="30" font-weight="700" fill="#102A56">Menu rõ ràng, nhẹ mắt hơn</text>
  <text x="64" y="124" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="14" fill="#71819A">Bỏ số thứ tự · gom mục theo tác vụ · giữ màu xanh dương đã duyệt</text>

  <!-- Expanded sidebar -->
