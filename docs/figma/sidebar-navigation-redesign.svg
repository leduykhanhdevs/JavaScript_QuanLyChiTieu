    <circle cx="398" cy="1022" r="18" fill="#EFF6FF"/>
    <text x="398" y="1026" text-anchor="middle" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="700" fill="#2563EB">KL</text>
  </g>

  <!-- Rationale -->
  <g id="design-rationale">
    <rect x="490" y="154" width="1046" height="370" rx="18" fill="#FFFFFF" stroke="#E5EAF2"/>
    <text x="522" y="193" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="20" font-weight="700" fill="#102A56">Điều hướng rõ ràng hơn</text>
    <text x="522" y="220" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" fill="#71819A">Nhóm menu theo việc người dùng cần làm, thay vì đánh số từng dòng.</text>
    <g id="reason-remove-numbers"><circle cx="540" cy="265" r="15" fill="#EFF6FF"/><text x="540" y="269" text-anchor="middle" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="9" font-weight="700" fill="#2563EB">01</text><text x="570" y="261" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" font-weight="600" fill="#172B4D">Bỏ số thứ tự</text><text x="570" y="280" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="11" fill="#71819A">Icon cho biết chức năng ngay; không còn dãy số gây nhiễu.</text></g>
    <g id="reason-group"><circle cx="540" cy="318" r="15" fill="#EFF6FF"/><text x="540" y="322" text-anchor="middle" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="9" font-weight="700" fill="#2563EB">02</text><text x="570" y="314" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" font-weight="600" fill="#172B4D">Gom theo tác vụ</text><text x="570" y="333" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="11" fill="#71819A">Tổng quan · Quản lý tài chính · Phân tích · Trợ giúp.</text></g>
    <g id="reason-current-state"><circle cx="540" cy="371" r="15" fill="#EFF6FF"/><text x="540" y="375" text-anchor="middle" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="9" font-weight="700" fill="#2563EB">03</text><text x="570" y="367" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" font-weight="600" fill="#172B4D">Biết rõ đang ở đâu</text><text x="570" y="386" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="11" fill="#71819A">Nền xanh nhẹ và vạch xanh tạo điểm nhấn vừa đủ.</text></g>
    <g id="reason-settings"><circle cx="540" cy="424" r="15" fill="#EFF6FF"/><text x="540" y="428" text-anchor="middle" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="9" font-weight="700" fill="#2563EB">04</text><text x="570" y="420" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" font-weight="600" fill="#172B4D">Không lặp mục cài đặt</text><text x="570" y="439" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="11" fill="#71819A">Cài đặt đi cùng hồ sơ ở cuối menu, đúng với cách dùng hiện tại.</text></g>
  </g>

  <!-- Active and inactive states -->
  <g id="states-and-colors">
    <rect x="490" y="544" width="1046" height="222" rx="18" fill="#FFFFFF" stroke="#E5EAF2"/>
    <text x="522" y="581" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="18" font-weight="700" fill="#102A56">Trạng thái &amp; màu sắc</text>
    <text x="522" y="604" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="12" fill="#71819A">Giữ xanh dương đã duyệt; giảm viền dày và khối nặng.</text>
    <g id="sample-active"><rect x="522" y="625" width="248" height="46" rx="11" fill="#EFF6FF"/><rect x="522" y="636" width="3" height="24" rx="1.5" fill="#2563EB"/><g transform="translate(538 636)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-7 10 7"/><path d="M4 8v12h16V8"/><path d="M9 20v-7h6v7"/></g><text x="572" y="654" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" font-weight="600" fill="#102A56">Tổng quan</text><text x="522" y="697" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="600" fill="#71819A">ĐANG CHỌN</text></g>
    <g id="sample-default"><rect x="788" y="625" width="248" height="46" rx="11" fill="#FFFFFF"/><g transform="translate(804 636)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="20" rx="2.5"/><path d="M7 7h10M7 12h10M7 17h6"/></g><text x="838" y="654" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" font-weight="500" fill="#172B4D">Giao dịch</text><text x="788" y="697" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="600" fill="#71819A">MẶC ĐỊNH</text></g>
    <g id="swatch-primary"><rect x="1070" y="625" width="30" height="30" rx="8" fill="#2563EB"/><text x="1112" y="638" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="600" fill="#71819A">Xanh chủ đạo</text><text x="1112" y="654" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" fill="#172B4D">#2563EB</text></g>
    <g id="swatch-selected"><rect x="1250" y="625" width="30" height="30" rx="8" fill="#EFF6FF" stroke="#D7E7FF"/><text x="1292" y="638" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="600" fill="#71819A">Nền chọn</text><text x="1292" y="654" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" fill="#172B4D">#EFF6FF</text></g>
  </g>

  <!-- Responsive notes -->
  <g id="responsive-guidance">
    <rect x="490" y="786" width="1046" height="276" rx="18" fill="#FFFFFF" stroke="#E5EAF2"/>
    <text x="522" y="824" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="18" font-weight="700" fill="#102A56">Co giãn theo màn hình</text>
    <text x="522" y="847" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="12" fill="#71819A">Màn hình hẹp có thể dùng thanh icon; nhãn vẫn đầy đủ ở bản mở rộng.</text>
    <line x1="522" y1="869" x2="1504" y2="869" stroke="#E5EAF2"/>
    <g id="target-size"><text x="522" y="906" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="16" font-weight="700" fill="#2563EB">44 px</text><text x="522" y="927" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="11" font-weight="600" fill="#172B4D">Vùng bấm</text><text x="522" y="947" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" fill="#71819A">Dễ thao tác trên cảm ứng</text></g>
    <g id="nav-count"><text x="838" y="906" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="16" font-weight="700" fill="#2563EB">9 mục</text><text x="838" y="927" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="11" font-weight="600" fill="#172B4D">Menu chính</text><text x="838" y="947" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" fill="#71819A">Cài đặt mở từ hồ sơ</text></g>
    <g id="icon-system"><text x="1150" y="906" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="16" font-weight="700" fill="#2563EB">20 px</text><text x="1150" y="927" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="11" font-weight="600" fill="#172B4D">Kích thước icon</text><text x="1150" y="947" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" fill="#71819A">Nét đồng nhất, ít gây nhiễu</text></g>
    <rect x="522" y="978" width="982" height="54" rx="12" fill="#F8FAFD"/>
    <circle cx="548" cy="1005" r="10" fill="#DBEAFE"/><path d="m544 1005 3 3 5-6" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="570" y="1009" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="11" fill="#52647E">Menu không dùng gạch chân hoặc tô nền khi rê chuột; trạng thái chọn luôn tĩnh và dễ nhận biết.</text>
  </g>
</svg>
