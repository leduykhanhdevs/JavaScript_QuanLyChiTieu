    <text x="82" y="665" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#95A3B8">PHÂN TÍCH</text>
    <g id="nav-reports">
      <g transform="translate(92 682)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V4M3 21h19"/><rect x="7" y="13" width="3" height="5" rx=".5"/><rect x="13" y="9" width="3" height="9" rx=".5"/><rect x="19" y="5" width="2" height="13" rx=".5"/></g>
      <text x="126" y="697" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="13" font-weight="500" fill="#172B4D">Báo cáo</text>
    </g>

    <text x="82" y="750" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#95A3B8">TRỢ GIÚP</text>
    <g id="nav-help">
      <g transform="translate(92 767)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.9 1.6c-1.2 1.1-1.7 1.5-1.7 3"/><path d="M12 17h.01"/></g>
      <text x="126" y="782" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="12" font-weight="500" fill="#172B4D">Thông tin &amp; trợ giúp</text>
    </g>

    <line x1="64" y1="984" x2="324" y2="984" stroke="#E5EAF2"/>
    <g id="profile-settings-entry">
      <rect x="78" y="998" width="232" height="48" rx="12" fill="#FFFFFF" stroke="#E5EAF2"/>
      <circle cx="103" cy="1022" r="17" fill="#EFF6FF"/>
      <text x="103" y="1026" text-anchor="middle" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="700" fill="#2563EB">KL</text>
      <text x="130" y="1018" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="11" font-weight="600" fill="#172B4D">Duy Khánh Lê</text>
      <text x="130" y="1034" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="9" fill="#71819A">Mở hồ sơ · Cài đặt</text>
      <path d="m292 1018 5 4-5 4" fill="none" stroke="#95A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Compact sidebar for narrow layouts -->
  <g id="sidebar-compact">
    <rect x="354" y="154" width="88" height="908" rx="18" fill="#FFFFFF" stroke="#E5EAF2"/>
    <circle cx="398" cy="194" r="20" fill="#2563EB"/>
    <text x="398" y="201" text-anchor="middle" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">V</text>
    <line x1="354" y1="234" x2="442" y2="234" stroke="#E5EAF2"/>
    <g id="compact-overview-active"><rect x="370" y="284" width="56" height="44" rx="12" fill="#EFF6FF"/><rect x="370" y="295" width="3" height="22" rx="1.5" fill="#2563EB"/><g transform="translate(386 294)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-7 10 7"/><path d="M4 8v12h16V8"/><path d="M9 20v-7h6v7"/></g></g>
    <g transform="translate(386 379)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="20" rx="2.5"/><path d="M7 7h10M7 12h10M7 17h6"/></g>
    <g transform="translate(386 427)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 9h20M6 15h5"/></g>
    <g transform="translate(386 475)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h19M5 18v-5M10 18V8M15 18v-7M20 18V4"/></g>
    <g transform="translate(386 523)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.7 9A7 7 0 0 1 18 6l2 6M18.3 15A7 7 0 0 1 6 18l-2-6"/></g>
    <g transform="translate(386 571)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></g>
    <g transform="translate(386 619)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></g>
    <g transform="translate(386 703)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V4M3 21h19"/><rect x="7" y="13" width="3" height="5" rx=".5"/><rect x="13" y="9" width="3" height="9" rx=".5"/><rect x="19" y="5" width="2" height="13" rx=".5"/></g>
    <g transform="translate(386 787)" fill="none" stroke="#71819A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.9 1.6c-1.2 1.1-1.7 1.5-1.7 3"/><path d="M12 17h.01"/></g>
