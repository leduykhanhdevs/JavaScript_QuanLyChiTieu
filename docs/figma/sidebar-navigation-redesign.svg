    <circle cx="102" cy="194" r="20" fill="#2563EB"/>
    <text x="102" y="201" text-anchor="middle" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">V</text>
    <text x="132" y="190" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="16" font-weight="700" fill="#102A56">Ví Mình</text>
    <text x="132" y="210" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="0.8" fill="#71819A">TÀI CHÍNH CÁ NHÂN</text>
    <line x1="64" y1="234" x2="324" y2="234" stroke="#E5EAF2"/>

    <text x="82" y="267" font-family="Be Vietnam Pro, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#95A3B8">TỔNG QUAN</text>
