  <rect x="270" y="32" width="220" height="34" rx="10" fill="#F8FAFC"/><text x="303" y="53" class="small muted">Tìm nhanh giao dịch...</text><circle cx="1382" cy="48" r="16" fill="#EFF6FF"/><text x="1382" y="52" text-anchor="middle" class="small blue" font-weight="700">KL</text>
  <text x="270" y="124" class="heading">Cài đặt tài khoản</text><text x="270" y="146" class="small muted">Quản lý hồ sơ, bảo mật và tùy chọn hiển thị của bạn.</text>
  <rect x="270" y="174" width="230" height="730" rx="15" fill="#FFF" stroke="#E2E8F0"/><text x="291" y="205" class="tiny light" font-weight="700">CÁ NHÂN</text><text x="304" y="239" class="small muted">Thông tin cá nhân</text><text x="304" y="277" class="small muted">Bảo mật &amp; mật khẩu</text><text x="291" y="322" class="tiny light" font-weight="700">ỨNG DỤNG</text><text x="304" y="357" class="small muted">Tùy chỉnh hiển thị</text><text x="304" y="395" class="small muted">Tài khoản &amp; dữ liệu</text><rect x="282" y="410" width="206" height="38" rx="10" fill="#EFF6FF"/><text x="313" y="434" class="small blue" font-weight="700">Liên kết ngân hàng</text><text x="304" y="471" class="small muted">Trợ giúp &amp; liên hệ</text>
  <text x="530" y="199" class="heading">Liên kết ngân hàng</text><text x="530" y="222" class="small muted">Đồng bộ giao dịch để phân loại nhanh và quản lý chi tiêu chủ động hơn.</text><rect x="530" y="244" width="860" height="285" rx="16" fill="#FFF" stroke="#E2E8F0"/><text x="554" y="286" class="card-title">Kết nối tài khoản ngân hàng</text><text x="554" y="310" class="small muted">Chỉ đọc dữ liệu sau khi bạn đồng ý.</text><rect x="554" y="343" width="196" height="43" rx="10" fill="#2563EB"/><text x="576" y="370" class="small" fill="#FFF">Bắt đầu liên kết</text><rect x="530" y="549" width="860" height="181" rx="16" fill="#FFF" stroke="#E2E8F0"/><text x="554" y="581" class="card-title">Quy trình hoạt động</text>
  <rect width="1440" height="960" fill="#0F172A" opacity=".42"/>
  <g filter="url(#dialogShadow)"><rect x="440" y="160" width="560" height="640" rx="22" fill="#FFF"/></g>
  <text x="480" y="208" class="tiny blue" font-weight="700" letter-spacing=".5">QUYỀN TRUY CẬP DỮ LIỆU</text>
  <text x="480" y="246" font-size="22" font-weight="700">Xác nhận liên kết ngân hàng</text>
  <text x="480" y="274" class="small muted">Vui lòng xem rõ phạm vi trước khi tiếp tục.</text>
  <g transform="translate(946 192) scale(.75)" color="#64748B"><path class="icon" d="m6 6 12 12M18 6 6 18"/></g>
  <rect x="480" y="302" width="480" height="94" rx="14" fill="#F8FAFC"/>
  <rect x="499" y="322" width="42" height="42" rx="13" fill="#EFF6FF"/><g transform="translate(509 332) scale(.9)" color="#2563EB"><path class="icon" d="m3 9 9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 21h18M4 18h16"/></g>
  <text x="555" y="333" class="small" font-weight="700">Đối tác kết nối ngân hàng</text><text x="555" y="354" class="tiny muted">Tên provider và danh sách ngân hàng sẽ hiện ở bước tiếp theo.</text><text x="555" y="373" class="tiny muted">Không dùng dữ liệu minh họa để tạo liên kết thật.</text>
  <text x="480" y="430" class="label">Ví Mình đề nghị quyền</text>
  <rect x="480" y="446" width="480" height="52" rx="12" fill="#FFF" stroke="#E2E8F0"/><circle cx="502" cy="472" r="10" fill="#EFF6FF"/><path d="m498 472 3 3 6-7" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="523" y="468" class="small" font-weight="600">Xem danh sách tài khoản ngân hàng</text><text x="523" y="484" class="tiny muted">Chỉ các tài khoản bạn chọn liên kết.</text>
  <rect x="480" y="506" width="480" height="52" rx="12" fill="#FFF" stroke="#E2E8F0"/><circle cx="502" cy="532" r="10" fill="#EFF6FF"/><path d="m498 532 3 3 6-7" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="523" y="528" class="small" font-weight="600">Đọc lịch sử giao dịch</text><text x="523" y="544" class="tiny muted">Chiều thu/chi và độ sâu lịch sử theo provider hỗ trợ.</text>
  <rect x="480" y="568" width="480" height="52" rx="12" fill="#FFF" stroke="#E2E8F0"/><circle cx="502" cy="594" r="10" fill="#EFF6FF"/><path d="m498 594 3 3 6-7" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="523" y="590" class="small" font-weight="600">Đọc số dư nếu ngân hàng cung cấp</text><text x="523" y="606" class="tiny muted">Không khởi tạo thanh toán hoặc chuyển tiền.</text>
  <rect x="480" y="640" width="18" height="18" rx="4" fill="#2563EB"/><path d="m484 649 4 4 7-9" fill="none" stroke="#FFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="509" y="649" class="small">Tôi đồng ý cho Ví Mình truy cập các dữ liệu</text><text x="509" y="667" class="small">được nêu trên để quản lý tài chính của tôi.</text>
  <text x="480" y="700" class="tiny muted">Đây là consent riêng cho ngân hàng, không thay thế Điều khoản</text><text x="480" y="715" class="tiny muted">sử dụng hoặc Thông báo quyền riêng tư khi đăng ký.</text>
