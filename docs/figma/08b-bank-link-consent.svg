  <text x="42" y="111" class="tiny light" font-weight="700">MENU CHÍNH</text><g class="muted" font-size="11"><text x="69" y="151">Tổng quan</text><text x="69" y="191">Giao dịch</text><text x="69" y="231">Tài khoản</text><text x="69" y="271">Ngân sách</text><text x="69" y="311">Định kỳ</text><text x="69" y="351">Mục tiêu</text><text x="69" y="391">Báo cáo</text><text x="69" y="431">Danh mục</text></g><rect x="30" y="445" width="190" height="36" rx="10" fill="#EFF6FF"/><text x="69" y="467" class="small blue" font-weight="700">Cài đặt</text>
