<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Ví Mình — Xác nhận consent liên kết ngân hàng</title>
  <desc id="desc">Màn xác nhận quyền đọc dữ liệu trước khi mở Hosted Link hoặc trang ủy quyền, tách biệt với điều khoản đăng ký.</desc>
