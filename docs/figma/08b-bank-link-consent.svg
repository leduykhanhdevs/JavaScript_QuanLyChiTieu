  <rect x="480" y="754" width="116" height="38" rx="10" fill="#FFF" stroke="#E2E8F0"/><text x="538" y="778" text-anchor="middle" class="small" font-weight="600">Hủy</text>
  <rect x="608" y="754" width="352" height="38" rx="10" fill="#2563EB"/><text x="784" y="778" text-anchor="middle" class="small" font-weight="700" fill="#FFF">Tiếp tục tới bước chọn ngân hàng</text>
</svg>
