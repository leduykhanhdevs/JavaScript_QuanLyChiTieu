  <rect width="1440" height="960" fill="#F1F5F9"/><rect x="20" y="16" width="1400" height="928" rx="20" fill="#FFF" stroke="#E2E8F0"/><rect x="20" y="16" width="220" height="928" rx="20" fill="#FBFCFE"/><path d="M240 16v928M240 80h1180" stroke="#E2E8F0"/>
