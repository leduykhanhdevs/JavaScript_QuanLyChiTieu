<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Ví Mình — Cài đặt liên kết ngân hàng, cần xác thực lại</title>
<desc id="desc">Trạng thái yêu cầu xác thực lại, hiển thị thông báo lỗi nền đỏ nhạt toàn khối, cách dữ liệu đang được xử lý và các lựa chọn thử lại, kết nối lại hoặc ngắt liên kết.</desc>
<defs><linearGradient id="brandR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs><style>text{font-family:'Be Vietnam Pro',Arial,sans-serif;fill:#1E293B}.muted{fill:#64748B}.light{fill:#94A3B8}.blue{fill:#2563EB}.tiny{font-size:9px}.small{font-size:11px}.body{font-size:10px}.heading{font-size:21px;font-weight:700}.card-title{font-size:13px;font-weight:700}.label{font-size:9px;font-weight:700;letter-spacing:.5px}</style>
<rect width="1440" height="960" fill="#FFFFFF"/><rect width="240" height="960" fill="#FBFCFE"/><path d="M240 0v960M240 72h1200" stroke="#E2E8F0"/><rect x="28" y="23" width="42" height="42" rx="14" fill="url(#brandR)"/><path d="m40 34 8 20 8-20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="61" cy="35" r="4.8" fill="#BFDBFE"/><circle cx="61" cy="35" r="1.7" fill="#1D4ED8"/><text x="80" y="42" font-size="15" font-weight="700">Ví Mình</text><text x="80" y="58" class="tiny muted" font-weight="700" letter-spacing=".5">TÀI CHÍNH CÁ NHÂN</text><text x="30" y="107" class="tiny light" font-weight="700">MENU CHÍNH</text>
<g class="small muted"><text x="66" y="150">Tổng quan</text><text x="66" y="190">Giao dịch</text><text x="66" y="230">Tài khoản</text><text x="66" y="270">Ngân sách</text><text x="66" y="310">Định kỳ</text><text x="66" y="350">Mục tiêu</text><text x="66" y="390">Báo cáo</text><text x="66" y="430">Danh mục</text></g><g fill="none" stroke="#64748B" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="m42 148 5-5 5 5m-8-1v7h6v-7m-4 7v-3h2v3"/><path d="M43 179h8v13l-2-1-2 1-2-1-2 1zM45 183h4m-4 3h4m-4 3h3"/><path d="M42 222a2 2 0 0 1 2-2h9v10h-9a2 2 0 0 1-2-2zM42 223h11v4h-3a2 2 0 0 1 0-4"/><circle cx="47" cy="266" r="7"/><path d="M47 259v7l5 3"/><path d="M51 307a5 5 0 1 0-1 3m1-3v-4m0 4h-4"/><circle cx="47" cy="346" r="7"/><circle cx="47" cy="346" r="3"/><path d="m41 393 4-4 3 2 5-6m-1 0h2v2"/><path d="M42 423h10l-1 9h-8zM44 423v-2h5v2"/></g><rect x="18" y="445" width="204" height="38" rx="11" fill="#EFF6FF"/><circle cx="47" cy="464" r="8" fill="#DBEAFE"/><g transform="translate(39.5 456.5) scale(.63)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 13.5 1.2 1-.9 2.1-1.5-.2a7.9 7.9 0 0 1-1.3 1l-.3 1.5h-2.3l-.7-1.4a8 8 0 0 1-1.6 0l-.7 1.4H9l-.3-1.5a7.9 7.9 0 0 1-1.3-1l-1.5.2L5 14.5l1.2-1a8 8 0 0 1 0-1.6l-1.2-1 .9-2.1 1.5.2a7.9 7.9 0 0 1 1.3-1L9 6.5h2.3l.7 1.4a8 8 0 0 1 1.6 0l.7-1.4h2.3l.3 1.5a7.9 7.9 0 0 1 1.3 1l1.5-.2.9 2.1-1.2 1a8 8 0 0 1 0 1.6Z"/></g><text x="66" y="468" class="small blue" font-weight="700">Cài đặt</text><circle cx="47" cy="916" r="17" fill="#DBEAFE"/><text x="47" y="920" text-anchor="middle" class="tiny blue" font-weight="700">KL</text><text x="72" y="914" class="small" font-weight="700">Lê Duy Khánh</text><text x="72" y="930" class="tiny light">Quản lý tài chính của riêng bạn</text>
<rect x="270" y="19" width="225" height="36" rx="11" fill="#F8FAFC"/><text x="307" y="40" class="small muted">Tìm nhanh giao dịch...</text><circle cx="1380" cy="36" r="17" fill="#EFF6FF"/><text x="1380" y="40" text-anchor="middle" class="small blue" font-weight="700">KL</text><text x="278" y="121" class="heading">Cài đặt tài khoản</text><text x="278" y="143" class="small muted">Quản lý hồ sơ, bảo mật và tùy chọn hiển thị của bạn.</text>
<rect x="278" y="166" width="224" height="455" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/><text x="298" y="196" class="tiny light" font-weight="700">CÁ NHÂN</text><text x="312" y="232" class="small muted">Thông tin cá nhân</text><text x="312" y="270" class="small muted">Bảo mật &amp; mật khẩu</text><text x="298" y="315" class="tiny light" font-weight="700">ỨNG DỤNG</text><text x="312" y="350" class="small muted">Tùy chỉnh hiển thị</text><text x="312" y="388" class="small muted">Tài khoản &amp; dữ liệu</text><rect x="292" y="405" width="196" height="35" rx="10" fill="#EFF6FF"/><text x="312" y="427" class="small blue" font-weight="700">Liên kết ngân hàng</text><text x="312" y="464" class="small muted">Trợ giúp &amp; liên hệ</text>
<text x="530" y="195" class="heading">Liên kết ngân hàng</text><text x="530" y="217" class="small muted">Xem trạng thái, thử đồng bộ lại hoặc khôi phục quyền truy cập.</text><rect x="530" y="244" width="842" height="39" rx="10" fill="#EFF6FF"/><circle cx="550" cy="263" r="8" fill="#DBEAFE"/><path d="M547 263h6m-3-3v6" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/><text x="566" y="267" class="tiny blue" font-weight="700">TRẠNG THÁI MÔ PHỎNG — CHƯA KẾT NỐI NGÂN HÀNG THẬT</text>
<rect x="530" y="300" width="842" height="324" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="573" cy="345" r="22" fill="#FEF3C7"/><path d="M573 332v16m0 5v1" stroke="#B45309" stroke-width="2" stroke-linecap="round"/><text x="610" y="340" class="card-title">Cần xác thực lại</text><text x="610" y="361" class="small muted">Quyền truy cập mẫu đã hết hạn hoặc provider yêu cầu xác nhận lại.</text><rect x="554" y="386" width="794" height="61" rx="10" fill="#FEF2F2"/><circle cx="577" cy="416" r="9" fill="#FEE2E2"/><path d="m574 413 6 6m0-6-6 6" stroke="#B91C1C" stroke-width="1.4" stroke-linecap="round"/><text x="596" y="413" class="small" fill="#991B1B" font-weight="700">Đồng bộ không thành công</text><text x="596" y="430" class="tiny" fill="#991B1B">Lần thử gần nhất: 10:42 · Lỗi xác thực hết hạn · Dữ liệu chưa đồng bộ mới</text>
<text x="554" y="477" class="small" font-weight="700">Điều gì xảy ra với dữ liệu của bạn?</text><text x="554" y="500" class="body muted">Giao dịch đã nhập trước đó vẫn ở trong sổ tài chính của bạn. Ví Mình sẽ tạm dừng</text><text x="554" y="517" class="body muted">đồng bộ mới cho đến khi bạn xác thực lại hoặc ngắt liên kết.</text><rect x="554" y="542" width="144" height="40" rx="9" fill="#2563EB"/><text x="626" y="567" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Kết nối lại</text><rect x="710" y="542" width="132" height="40" rx="9" fill="#EFF6FF"/><text x="776" y="567" text-anchor="middle" class="small blue" font-weight="700">Thử đồng bộ lại</text><rect x="854" y="542" width="124" height="40" rx="9" fill="#FFFFFF" stroke="#FECACA"/><text x="916" y="567" text-anchor="middle" class="small" fill="#B91C1C" font-weight="700">Ngắt liên kết</text>
<rect x="530" y="644" width="842" height="106" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="554" y="674" class="card-title">Nếu bạn chọn ngắt liên kết</text><text x="554" y="700" class="body muted">Đồng bộ mới sẽ dừng. Dữ liệu giao dịch đã nhập được giữ lại theo lựa chọn của bạn;</text><text x="554" y="717" class="body muted">xóa lịch sử đã nhập là thao tác riêng và sẽ cần xác nhận thêm.</text><text x="554" y="737" class="tiny light">Xác nhận ngắt liên kết phải hiển thị hộp thoại giải thích trước khi thực hiện.</text>
<text x="530" y="798" class="tiny light">Thông báo lỗi dùng nền đỏ nhạt toàn khối; không dùng viền nhấn màu đỏ ở cạnh.</text><text x="530" y="817" class="tiny light">Không yêu cầu nhập mật khẩu, PIN hoặc OTP ngân hàng trong Ví Mình.</text>
</svg>
