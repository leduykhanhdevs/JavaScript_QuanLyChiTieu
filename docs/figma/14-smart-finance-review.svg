<text x="60" y="66" font-size="30" font-weight="700">Ví Mình · Thiết kế chức năng thông minh</text><text x="60" y="99" font-size="15" fill="#637b9e">Layout đã duyệt · dữ liệu trong bản vẽ chỉ minh họa</text>
<g transform="translate(60 130)"><rect width="640" height="405" rx="24" fill="#fff" stroke="#dbe6f5"/><text x="28" y="44" font-size="20" font-weight="700">01 · Dự báo số dư</text><text x="28" y="72" font-size="13" fill="#7285a1">Chọn tài khoản và thời điểm cần xem</text><rect x="28" y="96" width="280" height="48" rx="12" fill="#f6f9ff" stroke="#dbe6f5"/><text x="44" y="126" font-size="14">Tài khoản ▾</text><rect x="320" y="96" width="292" height="48" rx="12" fill="#f6f9ff" stroke="#dbe6f5"/><text x="336" y="126" font-size="14">Đến kỳ thu nhập ▾</text><rect x="28" y="165" width="584" height="92" rx="15" fill="#edf4ff"/><text x="45" y="196" font-size="13" fill="#52749f">SỐ DƯ ƯỚC TÍNH</text><text x="45" y="231" font-size="24" font-weight="700" fill="#245fea">— đ</text><text x="28" y="297" font-size="14" font-weight="700">Các khoản dự kiến</text><text x="28" y="327" font-size="13" fill="#7285a1">Khoản định kỳ · mức chi dựa trên lịch sử</text><text x="28" y="365" font-size="13" fill="#245fea">Xem phương pháp tính và giới hạn →</text></g>
<g transform="translate(740 130)"><rect width="640" height="405" rx="24" fill="#fff" stroke="#dbe6f5"/><text x="28" y="44" font-size="20" font-weight="700">02 · Quét hóa đơn</text><text x="28" y="72" font-size="13" fill="#7285a1">Kiểm tra thông tin trước khi tạo giao dịch</text><rect x="28" y="96" width="250" height="213" rx="16" fill="#f6f9ff" stroke="#cbdcf4" stroke-dasharray="6 5"/><text x="71" y="190" font-size="14" fill="#245fea">Chọn ảnh hóa đơn</text><text x="308" y="117" font-size="13">Số tiền</text><rect x="308" y="128" width="304" height="41" rx="10" fill="#fff" stroke="#dbe6f5"/><text x="308" y="198" font-size="13">Ngày · Danh mục · Tài khoản</text><rect x="308" y="209" width="304" height="41" rx="10" fill="#fff" stroke="#dbe6f5"/><rect x="308" y="270" width="304" height="42" rx="10" fill="#2563eb"/><text x="396" y="297" font-size="13" font-weight="700" fill="#fff">Xem trước và lưu</text><text x="28" y="364" font-size="13" fill="#7285a1">Ảnh và kết quả nhận diện cần được xác nhận</text></g>
<g transform="translate(60 565)"><rect width="640" height="355" rx="24" fill="#fff" stroke="#dbe6f5"/><text x="28" y="44" font-size="20" font-weight="700">03 · Điểm cần xem lại</text><text x="28" y="72" font-size="13" fill="#7285a1">Gợi ý từ giao dịch, không tự kết luận hay xóa</text><rect x="28" y="96" width="584" height="88" rx="14" fill="#fff8ed"/><text x="46" y="128" font-size="15" font-weight="700">Chi danh mục tăng so với kỳ trước</text><text x="46" y="153" font-size="13" fill="#7285a1">Điều kiện so sánh và kỳ dữ liệu sẽ hiển thị tại đây</text><rect x="28" y="198" width="584" height="88" rx="14" fill="#f4f8ff"/><text x="46" y="230" font-size="15" font-weight="700">Có giao dịch có thể bị trùng</text><text x="46" y="255" font-size="13" fill="#245fea">Xem các giao dịch liên quan →</text><text x="28" y="321" font-size="13" fill="#7285a1">Chưa đủ dữ liệu? Hiển thị hướng dẫn thay cho số giả.</text></g>
<g transform="translate(740 565)"><rect width="640" height="355" rx="24" fill="#fff" stroke="#dbe6f5"/><text x="28" y="44" font-size="20" font-weight="700">04 · Agent Admin</text><text x="28" y="72" font-size="13" fill="#7285a1">Số liệu vận hành tổng hợp theo kỳ</text><rect x="28" y="96" width="176" height="88" rx="14" fill="#f4f8ff"/><rect x="218" y="96" width="176" height="88" rx="14" fill="#f4f8ff"/><rect x="408" y="96" width="204" height="88" rx="14" fill="#f4f8ff"/><text x="43" y="126" font-size="13">Người dùng mới</text><text x="233" y="126" font-size="13">Giao dịch</text><text x="423" y="126" font-size="13">Trạng thái dịch vụ</text><text x="43" y="158" font-size="19" fill="#245fea">—</text><text x="233" y="158" font-size="19" fill="#245fea">—</text><text x="423" y="158" font-size="13" fill="#245fea">Theo dữ liệu API</text><rect x="28" y="204" width="584" height="77" rx="14" fill="#edf4ff"/><text x="46" y="235" font-size="14">Đề xuất kế hoạch từ xu hướng và trạng thái</text><text x="46" y="258" font-size="12" fill="#7285a1">Doanh thu: chỉ hiển thị khi có nguồn dữ liệu thật</text><text x="28" y="319" font-size="13" fill="#245fea">Mở tổng quan · Người dùng · Nhật ký →</text></g>
<g transform="translate(60 950)"><rect width="1320" height="400" rx="24" fill="#fff" stroke="#dbe6f5"/><text x="28" y="45" font-size="20" font-weight="700">05 · AI Coach trong bong bóng hiện tại</text><text x="28" y="75" font-size="13" fill="#7285a1">Phân tích tài chính cá nhân và dẫn đến giao dịch liên quan</text><rect x="28" y="100" width="710" height="180" rx="16" fill="#f5f8fd"/><text x="48" y="135" font-size="14" font-weight="700">“Tháng này chi ăn uống thay đổi thế nào?”</text><text x="48" y="172" font-size="14">So sánh theo kỳ · số tiền · nguyên nhân từ dữ liệu hiện có</text><text x="48" y="202" font-size="13" fill="#7285a1">Hiện khoảng thời gian và giao dịch làm căn cứ.</text><rect x="48" y="224" width="160" height="36" rx="10" fill="#e4efff"/><text x="61" y="247" font-size="12" fill="#245fea">Xem giao dịch →</text><rect x="220" y="224" width="155" height="36" rx="10" fill="#e4efff"/><text x="234" y="247" font-size="12" fill="#245fea">Tạo ngân sách →</text><rect x="772" y="100" width="520" height="180" rx="16" fill="#edf4ff"/><text x="794" y="139" font-size="15" font-weight="700">Trước khi lưu thay đổi</text><text x="794" y="172" font-size="13">Hiện bản xem trước để người dùng xác nhận.</text><text x="794" y="202" font-size="13">Dữ liệu được xử lý theo tài khoản đăng nhập.</text><text x="28" y="335" font-size="13" fill="#7285a1">Màn hình nhỏ: các khối xếp dọc; khung chat tiếp tục thu gọn được.</text></g>
<text x="60" y="1412" font-size="13" fill="#7285a1">Nguồn thiết kế: design system Ví Mình và luồng nghiệp vụ trong docs/SMART_FINANCE_PLAN.md.</text>
